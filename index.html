<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotron 2084, reconstructed</title>
<meta name="description" content="A browser reconstruction of Robotron: 2084's first four waves, rebuilt from the 1982 Williams source. WASD to move, arrows to fire, agent-playable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: 'Press Start 2P', monospace; overflow: hidden; }
	[hidden] { display: none !important; }
	.wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
	.hud { display: flex; gap: 28px; font-size: 13px; letter-spacing: 1px; }
	.hud b { color: #ff3b3b; font-weight: normal; }
	.screen { position: relative; }
	canvas {
		display: block;
		width: min(92vw, calc((100vh - 110px) * 1.25));
		aspect-ratio: 300 / 240;
		image-rendering: pixelated;
		border: 4px solid var(--wave, #ff3b3b);
		box-shadow: 0 0 24px var(--wave, #ff3b3b);
	}
	.screen::after {
		content: '';
		position: absolute;
		inset: 4px;
		pointer-events: none;
		background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.25) 2px 3px);
	}
	.overlay {
		position: absolute;
		inset: 4px;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 16px;
		text-align: center;
		background: rgba(0, 0, 0, 0.72);
		font-size: 12px;
		line-height: 1.8;
		cursor: pointer;
	}
	.overlay h1 { margin: 0; font-size: clamp(18px, 3.4vw, 30px); color: #ff3b3b; text-shadow: 3px 3px 0 #0036ff; font-weight: normal; }
	.overlay .blink { animation: blink 1s steps(2) infinite; color: #ffe14a; }
	.keys { color: #9aa; font-size: 10px; }
	.bar { display: flex; gap: 12px; align-items: center; font-size: 10px; color: #8a8a8a; flex-wrap: wrap; justify-content: center; }
	.bar button {
		font: inherit;
		background: none;
		color: #ddd;
		border: 2px solid #555;
		padding: 6px 10px;
		cursor: pointer;
	}
	.bar button:hover, .bar button.on { border-color: #ffe14a; color: #ffe14a; }
	.bar a { color: #aaa; }
	@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
	<div class="hud">
		<span>SCORE <b id="score">0</b></span>
		<span>WAVE <b id="wave">1</b></span>
		<span>MEN <b id="lives">3</b></span>
	</div>
	<div class="screen">
		<canvas id="c" width="300" height="240"></canvas>
		<div id="title" class="overlay">
			<h1>ROBOTRON: 2084</h1>
			<div>SAVE THE LAST HUMAN FAMILY</div>
			<div class="keys">WASD MOVE &nbsp; ARROWS FIRE<br>OR AIM AND HOLD THE MOUSE</div>
			<div class="blink">PRESS ENTER</div>
		</div>
		<div id="over" class="overlay" hidden>
			<h1>GAME OVER</h1>
			<div id="final"></div>
			<div class="blink">PRESS ENTER TO GO AGAIN</div>
		</div>
		<div id="paused" class="overlay" hidden><div class="blink">PAUSED</div></div>
	</div>
	<div class="bar">
		<button id="agentBtn" type="button">WATCH AGENT</button>
		<span>P PAUSE</span>
		<a href="https://github.com/NICOH-YAY/robotron-recon/blob/main/SCOPE.md">SCOPE RECORD</a>
		<a href="https://github.com/historicalsource/robotron">ORIGINAL SOURCE</a>
	</div>
</div>

<script src="js/sim.js"></script>
<script src="js/agent-api.js"></script>
<script src="js/greedy.js"></script>
<script>
(function() {
	'use strict';
	const cv = document.getElementById('c');
	const ctx = cv.getContext('2d');
	const $ = (id) => document.getElementById(id);
	const WAVE_COLORS = ['#ff3b3b', '#2f7bff', '#3bff6b', '#ffe14a', '#ff4bd8', '#38f3ff', '#ff8a1f', '#ffffff'];

	let sim = null, env = null;
	let mode = 'title';          // 'title' | 'play' | 'over'
	let paused = false, agentOn = false;
	const keys = new Set();
	const mouse = { x: 150, y: 120, down: false };

	function newGame() {
		sim = RobotronSim.create((Date.now() & 0xffffff) | 1);
		env = RobotronAgentAPI.makeEnv(sim);
		mode = 'play';
		paused = false;
		$('title').hidden = true;
		$('over').hidden = true;
		$('paused').hidden = true;
		audio();
	}

	/* ---------- input ---------- */

	addEventListener('keydown', (e) => {
		const k = e.key.toLowerCase();
		if(k.startsWith('arrow') || k === ' ') e.preventDefault();
		keys.add(k);
		if(k === 'enter' && mode !== 'play') newGame();
		if(k === 'p' && mode === 'play') { paused = !paused; $('paused').hidden = !paused; }
	});
	addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
	addEventListener('blur', () => keys.clear());
	cv.addEventListener('mousemove', (e) => {
		const r = cv.getBoundingClientRect();
		mouse.x = (e.clientX - r.left) / r.width * 300;
		mouse.y = (e.clientY - r.top) / r.height * 240;
	});
	cv.addEventListener('mousedown', () => { mouse.down = true; });
	addEventListener('mouseup', () => { mouse.down = false; });
	$('title').addEventListener('click', newGame);
	$('over').addEventListener('click', newGame);
	$('agentBtn').addEventListener('click', () => {
		agentOn = !agentOn;
		$('agentBtn').classList.toggle('on', agentOn);
		$('agentBtn').textContent = agentOn ? 'AGENT PLAYING' : 'WATCH AGENT';
		if(agentOn && mode !== 'play') newGame();
	});

	const axis = (neg, pos) => (keys.has(pos) ? 1 : 0) - (keys.has(neg) ? 1 : 0);

	function humanInput() {
		const move = [axis('a', 'd'), axis('w', 's')];
		let fire = [axis('arrowleft', 'arrowright'), axis('arrowup', 'arrowdown')];
		if(!fire[0] && !fire[1] && mouse.down && sim) {
			const p = sim.g.player, dx = mouse.x - p.x, dy = mouse.y - p.y;
			const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
			fire = [Math.round(Math.cos(a * Math.PI / 4)), Math.round(Math.sin(a * Math.PI / 4))];
		}
		return { move, fire };
	}

	/* ---------- sound, all synthesized ---------- */

	let ac = null;
	function audio() {
		if(!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { ac = null; }
	}
	function beep(f0, f1, dur, type, vol) {
		if(!ac) return;
		const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
		o.type = type || 'square';
		o.frequency.setValueAtTime(f0, t);
		o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
		g.gain.setValueAtTime(vol || 0.05, t);
		g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
		o.connect(g).connect(ac.destination);
		o.start(t);
		o.stop(t + dur + 0.02);
	}
	const SOUND = {
		shot: () => beep(1400, 500, 0.05, 'square', 0.02),
		wave: () => beep(200, 800, 0.5, 'sawtooth', 0.06),
		'wave-clear': () => beep(600, 1600, 0.3, 'triangle', 0.08),
		rescue: () => { beep(700, 1400, 0.12, 'triangle', 0.1); setTimeout(() => beep(1000, 2000, 0.15, 'triangle', 0.1), 110); },
		'human-lost': () => beep(300, 60, 0.4, 'sawtooth', 0.08),
		death: () => beep(900, 40, 0.9, 'sawtooth', 0.12),
		'extra-life': () => { for(let i = 0; i < 4; i++) setTimeout(() => beep(600 + i * 200, 900 + i * 200, 0.1, 'square', 0.06), i * 90); },
		'game-over': () => beep(400, 30, 1.6, 'sawtooth', 0.1)
	};

	/* ---------- drawing ---------- */

	function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

	const SPR = {
		player(x, y, f) {
			px(x - 2, y - 5, 5, 3, '#ffe14a');
			px(x - 3, y - 2, 7, 4, f % 20 < 10 ? '#ff3b3b' : '#ffffff');
			px(x - 2, y + 2, 2, 3, '#2f7bff');
			px(x + 1, y + 2, 2, 3, '#2f7bff');
		},
		grunt(x, y, f) {
			const c = f % 16 < 8 ? '#ff3b3b' : '#ffe14a';
			px(x - 3, y - 4, 7, 3, c);
			px(x - 2, y - 1, 5, 3, '#ffe14a');
			px(x - 3, y + 2, 2, 3, c);
			px(x + 2, y + 2, 2, 3, c);
			px(x - 1, y - 3, 1, 1, '#000'); px(x + 1, y - 3, 1, 1, '#000');
		},
		hulk(x, y) {
			px(x - 4, y - 5, 9, 5, '#3bff6b');
			px(x - 3, y - 7, 7, 2, '#1c8f35');
			px(x - 4, y, 3, 5, '#1c8f35');
			px(x + 2, y, 3, 5, '#1c8f35');
			px(x - 2, y - 4, 5, 1, '#000');
		},
		electrode(x, y, c) {
			px(x - 3, y, 7, 1, c); px(x, y - 3, 1, 7, c);
			px(x - 2, y - 2, 1, 1, c); px(x + 2, y - 2, 1, 1, c); px(x - 2, y + 2, 1, 1, c); px(x + 2, y + 2, 1, 1, c);
		},
		human(x, y, kind, f) {
			const c = kind === 'mommy' ? '#ff6fb1' : kind === 'daddy' ? '#38f3ff' : '#ffe14a';
			const s = kind === 'mikey' ? 0.75 : 1;
			px(x - 1, y - 5 * s, 3, 2, '#f1c9a5');
			px(x - 2, y - 3 * s, 5, 4 * s, c);
			const step = f % 20 < 10 ? 0 : 1;
			px(x - 2 + step, y + 1, 1, 3 * s, '#ddd');
			px(x + 1 - step, y + 1, 1, 3 * s, '#ddd');
		}
	};

	function draw() {
		ctx.fillStyle = '#000';
		ctx.fillRect(0, 0, 300, 240);
		if(!sim) return;
		const g = sim.g, f = g.frame;
		const wc = WAVE_COLORS[(g.wave - 1) % WAVE_COLORS.length];
		document.documentElement.style.setProperty('--wave', wc);
		for(const e of g.electrodes) SPR.electrode(e.x, e.y, WAVE_COLORS[(g.wave + 2) % WAVE_COLORS.length]);
		for(const h of g.humans) SPR.human(h.x, h.y, h.kind, f);
		for(const h of g.hulks) SPR.hulk(h.x, h.y);
		for(const gr of g.grunts) SPR.grunt(gr.x, gr.y, f);
		ctx.strokeStyle = '#ffffff';
		for(const s of g.shots) {
			ctx.beginPath();
			ctx.moveTo(s.x, s.y);
			ctx.lineTo(s.x - s.dx * 1.2, s.y - s.dy * 1.2);
			ctx.stroke();
		}
		if(g.state === 'dead') {
			const k = 90 - g.timer;
			for(let i = 0; i < 12; i++) {
				const a = i / 12 * Math.PI * 2;
				px(g.player.x + Math.cos(a) * k * 0.8, g.player.y + Math.sin(a) * k * 0.8, 2, 2, WAVE_COLORS[i % 8]);
			}
		} else if(g.state !== 'over') {
			SPR.player(g.player.x, g.player.y, f);
		}
		ctx.font = '6px "Press Start 2P", monospace';
		ctx.textAlign = 'center';
		for(const p of g.popups) {
			ctx.fillStyle = p.text === 'skull' ? '#ff3b3b' : '#ffffff';
			ctx.fillText(p.text === 'skull' ? 'X' : p.text, p.x, p.y - (45 - p.life) * 0.15);
		}
		ctx.font = '10px "Press Start 2P", monospace';
		ctx.fillStyle = wc;
		if(g.state === 'clear') ctx.fillText('WAVE ' + g.wave + ' CLEAR', 150, 120);
		if(g.waveFrame < 70 && g.state === 'play') {
			ctx.fillText('WAVE ' + g.wave, 150, 110);
			if(g.wave > 4 && (g.wave - 1) % 4 === 0) ctx.fillText('FASTER NOW', 150, 126);
		}
	}

	/* ---------- the loop ---------- */

	let last = performance.now(), acc = 0;
	function loop(now) {
		acc += Math.min(100, now - last);
		last = now;
		while(acc >= 1000 / 60) {
			acc -= 1000 / 60;
			if(mode === 'play' && !paused) {
				const input = agentOn ? RobotronGreedy.policy(env.observe()) : humanInput();
				const before = sim.g.shots.length;
				sim.step(input);
				if(sim.g.shots.length > before) SOUND.shot();
				handleEvents();
			}
		}
		if(sim) {
			$('score').textContent = sim.g.score;
			$('wave').textContent = sim.g.wave;
			$('lives').textContent = sim.g.lives;
		}
		draw();
		requestAnimationFrame(loop);
	}

	function handleEvents() {
		for(const ev of sim.g.events.splice(0)) {
			if(SOUND[ev.type]) SOUND[ev.type]();
			if(ev.type === 'game-over') {
				mode = 'over';
				$('final').innerHTML = 'SCORE ' + ev.score + '<br>REACHED WAVE ' + ev.wave;
				$('over').hidden = false;
				if(agentOn) setTimeout(() => { if(agentOn) newGame(); }, 2500);
			}
		}
	}
	requestAnimationFrame(loop);

	// for agents driving this page: robotron.start(), robotron.act({move, fire}, frames), robotron.observe()
	// while an agent drives, the page's own loop is paused so the two never fight
	window.robotron = {
		start() { newGame(); paused = true; return env.observe(); },
		observe: () => (env ? env.observe() : null),
		act(a, n) {
			if(!env) newGame();
			paused = true;
			const o = env.act(a, n);
			handleEvents();
			return o;
		},
		resume() { paused = false; },
		allowedFields: RobotronAgentAPI.ALLOWED
	};
})();
</script>
</body>
</html>
